<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-blue)">
    <!-- Tashqi uchburchak -->
    <polygon points="32 6, 6 54, 58 54" />

    <!-- Piyodalar yo'lagi (Zebra chiziqlari) -->
    <line x1="16" y1="48" x2="20" y2="48" />
    <line x1="24" y1="48" x2="28" y2="48" />
    <line x1="32" y1="48" x2="36" y2="48" />
    <line x1="40" y1="48" x2="44" y2="48" />

    <!-- Piyoda figurasi -->
    <circle cx="32" cy="22" r="2.5" fill="#38bdf8" /> <!-- Bosh -->
    <path d="M 32 26 L 31 36 L 25 44" /> <!-- Tana va orqa oyoq -->
    <path d="M 31 36 L 38 43" /> <!-- Oldi oyoq -->
    <path d="M 27 30 L 32 29 L 36 34" /> <!-- Qollar -->
  </g>
</svg>