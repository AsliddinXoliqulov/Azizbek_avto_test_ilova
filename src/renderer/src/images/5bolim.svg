<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-blue)">
    <!-- Kitob korpusi va muqovasi -->
    <rect x="14" y="10" width="36" height="44" rx="4" />

    <!-- Kitob taxlamlari (sahifalar effekti) -->
    <path d="M 14 48 C 18 50, 46 50, 50 48" />
    <path d="M 14 51 C 18 53, 46 53, 50 51" />

    <!-- "TEORY" matni -->
    <text x="32" y="27" font-family="sans-serif" font-weight="bold" font-size="7" fill="#38bdf8" stroke="none" text-anchor="middle" letter-spacing="1">TEORY</text>

    <!-- Pastki tekst chiziqlari -->
    <line x1="24" y1="34" x2="40" y2="34" />
    <line x1="27" y1="39" x2="37" y2="39" />
  </g>
</svg>